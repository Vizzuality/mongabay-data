[project]
name = "data-processing"
version = "0.1.0"
description = "Data processing and analysis for the Mongabay project family"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "boto3>=1.43.108",
    "geopandas>=1.0.1",
    "ipykernel>=6.29.5",
    "jupyterlab>=4.3.0",
    "matplotlib>=3.10.0",
    "numpy>=2.1.0",
    "pandas>=2.2.3",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "rich>=15.0.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_processing"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "notebooks", "tests"]
extend-include = ["*.ipynb"]
extend-exclude = ["notebooks/archive", "cloud_functions"]

[tool.ruff.lint]
select = [
    "UP",  # pyupgrade
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "N",   # naming conventions
    "I",   # isort
]

[tool.ruff.lint.per-file-ignores]
# Template notebooks carry unused, hand-grouped imports on purpose: they are the
# starting point for new work, not code. Autofixing them empties the template.
"notebooks/templates/**" = ["F401", "I001"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.pyright]
venvPath = "."
venv = ".venv"
